
name: CI-CD Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Tests
        run: |
          pytest

  deploy:

    needs: test
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Artifact
        run: |
          mkdir release
          cp -r src release/
          cp -r services release/
          cp -r api release/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: assignment-tracker-release
          path: release/
